services:
  # MySQL Database
  # NOTE: In production (Railway), each service has its own MySQL instance
  # In Docker, we share one MySQL with multiple databases for simplicity
  mysql:
    image: mysql:8.0
    container_name: trafficschool-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD}
      # Primary database (legacy - not really used anymore)
      MYSQL_DATABASE: ${DOCKER_MYSQL_DATABASE:-trafficschool}
    ports:
      - "${DOCKER_MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Initialize script to create all databases
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - trafficschool-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eureka Server
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - trafficschool-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # User Service
  user-service:
    build: ./userService
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQLHOST=mysql
      - MYSQLPORT=3306
      - MYSQLDATABASE=userServiceDb
      - MYSQLUSER=root
      - MYSQLPASSWORD=${DOCKER_MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    networks:
      - trafficschool-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # Admin Service
  admin-service:
    build: ./adminService
    container_name: admin-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQLHOST=mysql
      - MYSQLPORT=3306
      - MYSQLDATABASE=adminServiceDb
      - MYSQLUSER=root
      - MYSQLPASSWORD=${DOCKER_MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    networks:
      - trafficschool-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # Payment Service
  payment-service:
    build: ./paymentService
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQLHOST=mysql
      - MYSQLPORT=3306
      - MYSQLDATABASE=paymentServiceDb
      - MYSQLUSER=root
      - MYSQLPASSWORD=${DOCKER_MYSQL_ROOT_PASSWORD}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - SWISH_CALLBACK_URL=${SWISH_CALLBACK_URL}
    networks:
      - trafficschool-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # Quiz Service
  quiz-service:
    build: ./quizService
    container_name: quiz-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQLHOST=mysql
      - MYSQLPORT=3306
      - MYSQLDATABASE=quizServiceDb
      - MYSQLUSER=root
      - MYSQLPASSWORD=${DOCKER_MYSQL_ROOT_PASSWORD}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    networks:
      - trafficschool-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # Exam Service
  exam-service:
    build: ./examService
    container_name: exam-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQLHOST=mysql
      - MYSQLPORT=3306
      - MYSQLDATABASE=examservicedb
      - MYSQLUSER=root
      - MYSQLPASSWORD=${DOCKER_MYSQL_ROOT_PASSWORD}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    networks:
      - trafficschool-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    networks:
      - trafficschool-network
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
      admin-service:
        condition: service_started
      payment-service:
        condition: service_started
      exam-service:
        condition: service_started
      quiz-service:
        condition: service_started

networks:
  trafficschool-network:
    driver: bridge

volumes:
  mysql-data:
